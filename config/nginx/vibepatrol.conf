    ssl_certificate     /etc/letsencrypt/live/vtrnk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtrnk.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/beasty197/projects/vtrnk_radio/vtrnk-sites/vtrnk.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/landing-vtrnk.com.access.log;
