# =============================================================================
# Конфиг vibe patrol + обслуживание лендингов vtrnk.com / .me / .ru
# =============================================================================

# HTTP → HTTPS редирект (для всех доменов, включая лендинги)
server {
    listen 80;
    listen [::]:80;

    server_name vibepatrol.me www.vibepatrol.me
                vtrnk.com www.vtrnk.com
                vtrnk.me  www.vtrnk.me
                vtrnk.ru  www.vtrnk.ru;

    return 301 https://$host$request_uri;
}

# Основной HTTPS-блок vibe patrol
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name vibepatrol.me www.vibepatrol.me;

    ssl_certificate     /etc/letsencrypt/live/vibepatrol.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibepatrol.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/beasty197/projects/vibepatrol/web;
    index index.html;

    # ────────────────────────────────────────────────
    # Добавлено: прокси для смены языка (исправляет баг)
    location ~ ^/set_language {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Основная страница — статический лендинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические файлы, админка, etc.
    location ~ ^/(miniapp\.html|favicon\.ico|robots\.txt|static/|assets/|img/) {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /static/ {
        alias /home/beasty197/projects/vibepatrol/backend/static/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # если есть другие заголовки или настройки — оставь их здесь
    }
}

# HTTPS-блок для vtrnk.com
