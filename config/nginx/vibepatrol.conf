# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name vibepatrol.me www.vibepatrol.me;

    access_log /var/log/nginx/vibepatrol.access.log;
    error_log  /var/log/nginx/vibepatrol.error.log;

    return 301 https://$server_name$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibepatrol.me www.vibepatrol.me;

    # SSL от Certbot
    ssl_certificate     /etc/letsencrypt/live/vibepatrol.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibepatrol.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Логи
    access_log /var/log/nginx/vibepatrol.access.log;
    error_log  /var/log/nginx/vibepatrol.error.log;

    # Корневая папка со статикой (index.html, admin.html и т.д.)
    root /home/beasty197/projects/vibepatrol/web;
    index index.html;

    # ── СТАТИЧЕСКИЕ ФАЙЛЫ ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # Отдельные статические файлы
    location ~ ^/(miniapp\.html|favicon\.ico|robots\.txt)$ {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # Папки со статикой (css, js, img и т.д.)
    location ~ ^/(static|assets|img)/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Запрет кэширования для страницы админки и самого файла admin.html
    location = /admin.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # ── ДИНАМИКА: Flask (порт 5003) ─────────────────────────────────────
    location ~ ^/(api|admin-logout|login|me|save-vibe|logout|full-logout|login/telegram) {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Куки для HTTPS + cross-origin
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        proxy_cookie_domain $host $host;

        proxy_read_timeout 300;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # Админские страницы — только через Flask с проверкой (ловит /admin и /admin-*)
    location ~ ^/admin(/.*)?$ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        proxy_cookie_domain $host $host;

        proxy_read_timeout 300;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # Админская страница событий — через Flask для проверки авторизации
    location = /admin-events.html {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Отключаем кэш полностью — админка должна быть свежей
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        proxy_cookie_domain $host $host;

        proxy_read_timeout 300;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}