# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name vibepatrol.me www.vibepatrol.me;

    access_log /var/log/nginx/vibepatrol.access.log;
    error_log  /var/log/nginx/vibepatrol.error.log;

    return 301 https://$server_name$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibepatrol.me www.vibepatrol.me;

    # SSL от Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/vibepatrol.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibepatrol.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Логи
    access_log /var/log/nginx/vibepatrol.access.log;
    error_log  /var/log/nginx/vibepatrol.error.log;

    # Корень — статика (главная страница, miniapp.html и т.д.)
    root /home/beasty197/projects/vibepatrol/web;
    index index.html;

    # === СТАТИЧЕСКИЕ ФАЙЛЫ ===
    location / {
        try_files $uri $uri/ =404;
    }

    # Mini App — отдельно, чтобы точно отдавался
    location = /miniapp.html {
        try_files /miniapp.html =404;
    }

    # Папка со статикой (если вдруг будет /static/css, /static/js и т.д.)
    location /static/ {
        alias /home/beasty197/projects/vibepatrol/web/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Фавиконка
    location = /favicon.ico {
        alias /home/beasty197/projects/vibepatrol/web/favicon.ico;
        log_not_found off;
    }

    # === ВСЁ ДИНАМИЧЕСКОЕ — проксируем в Flask на 127.0.0.1:5003 ===
    # ВАЖНО: теперь ловит ВЕСЬ /api/ и все нужные роуты авторизации
    location ~ ^/(api/|login|me|save-vibe|logout|full-logout|login/telegram) {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300;

        # Дополнительно для корректной работы кук (на всякий случай)
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
    }

    # Если вдруг захотим отдать корень через Flask (например, render_template('index.html'))
    # location / {
    #     proxy_pass http://127.0.0.1:5003;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
