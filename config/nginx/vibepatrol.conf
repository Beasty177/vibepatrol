# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name vibepatrol.me www.vibepatrol.me;

    access_log /var/log/nginx/vibepatrol.access.log;
    error_log  /var/log/nginx/vibepatrol.error.log;

    return 301 https://$server_name$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibepatrol.me www.vibepatrol.me;

    # SSL от Certbot
    ssl_certificate     /etc/letsencrypt/live/vibepatrol.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibepatrol.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Логи
    access_log /var/log/nginx/vibepatrol.access.log;
    error_log  /var/log/nginx/vibepatrol.error.log;

    root /home/beasty197/projects/vibepatrol/web;
    index index.html;

    # 1. СТАТИКА — только корень и конкретные файлы (БЕЗ /admin/)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(miniapp\.html|favicon\.ico|robots\.txt|static/|assets/|img/) {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /static/ {
        alias /home/beasty197/projects/vibepatrol/backend/static/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 2. ВСЁ ПОД /admin/ — ТОЛЬКО НА FLASK (приоритет ^~ — бьёт try_files)
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        proxy_cookie_domain $host $host;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        proxy_read_timeout 300;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # 3. Другие динамические пути
    location ~ ^/(api|login/telegram|me|save-vibe|logout|full-logout) {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        proxy_cookie_domain $host $host;

        proxy_read_timeout 300;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }


    # 4. Переключение языка — тоже в Flask
    location ~ ^/set_language(/.*)?$ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        proxy_cookie_domain $host $host;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        proxy_read_timeout 300;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}