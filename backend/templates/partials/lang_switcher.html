<!-- partials/lang_switcher.html -->

<style>
    .lang-section {
        margin-bottom: 30px;
        text-align: center;
    }

    .lang-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 12px;
    }

    .lang-icon {
        width: 32px;
        height: 24px;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .lang-select-container {
        position: relative;
        width: 100%;
        max-width: 160px;               /* ← ширина выпадашки (здесь меняй) */
        margin: 0 auto;
    }

    .lang-select {
        background: rgba(255,255,255,0.1);
        color: white;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 8px;
        padding: 10px 36px 10px 14px;   /* ← внутренние отступы (можно уменьшить) */
        font-size: 1em;                 /* ← размер шрифта (можно 0.95em) */
        width: 100%;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        text-align: left;
    }

    .lang-select option {
        background: #2c3e50;
        color: white;
        padding: 8px;
    }

    .lang-select:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(76,175,80,0.5);
    }

    .select-arrow {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        font-size: 1.1em;
    }
</style>

<div class="lang-section">
    <!-- Три флага в ряд (визуальная подсказка) -->
    <div class="lang-icons">
        <img src="/static/flags/ru.png" alt="Русский" class="lang-icon">
        <img src="/static/flags/us.png" alt="English" class="lang-icon">
        <img src="/static/flags/il.png" alt="עברית" class="lang-icon">
    </div>

    <!-- Выпадашка -->
    <div class="lang-select-container">
        <select class="lang-select" onchange="window.location.href = this.value;">
            <option value="{{ url_for('set_language', lang='ru', next=request.full_path) }}" {% if session.lang == 'ru' or not session.lang %}selected{% endif %}>
                Русский
            </option>
            <option value="{{ url_for('set_language', lang='en', next=request.full_path) }}" {% if session.lang == 'en' %}selected{% endif %}>
                English
            </option>
            <option value="{{ url_for('set_language', lang='he', next=request.full_path) }}" {% if session.lang == 'he' %}selected{% endif %}>
                עברית
            </option>
        </select>
        <span class="select-arrow">▼</span>
    </div>
</div>
