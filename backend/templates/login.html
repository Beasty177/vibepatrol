<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibePatrol — вход</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.15);
      padding: 60px 50px;
      border-radius: 28px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-width: 90%;
    }
    h1 {
      font-size: 3.2em;
      margin: 0 0 20px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .btn {
      display: inline-block;
      background: #0088cc;
      color: white !important;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 1.6em;
      text-decoration: none;
      margin-top: 30px;
      box-shadow: 0 8px 20px rgba(0,136,204,0.4);
      transition: all 0.3s;
    }
    .btn:hover {
      background: #006fa3;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,136,204,0.5);
    }
    .note {
      margin-top: 40px;
      font-size: 1.1em;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VibePatrol</h1>
    <p style="font-size:1.4em; margin:20px 0;">Нажми кнопку — откроется чат с ботом</p>

    <a href="https://t.me/vibe_vibe_robot?start=login_from_web" class="btn">
      🚀 Войти через Telegram
    </a>

    <p class="note">
      После нажатия нажми «START» в чате с ботом<br>
      и ты автоматически войдёшь в свой профиль
    </p>
  </div>
</body>
</html>
