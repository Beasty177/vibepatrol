<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VibePatrol — Управление вечеринками</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e1e2f 0%, #2a1a3a 100%);
      color: #e0e0ff;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    h1 { text-align: center; color: #a78bfa; margin: 0.8em 0 0.4em; font-size: 2.6rem; }
    h2 { color: #c4b5fd; margin-bottom: 1.2rem; font-size: 1.6rem; }
    .section { margin: 2.5rem 0; background: rgba(35, 35, 55, 0.65); padding: 1.8rem; border-radius: 16px; border: 1px solid #4a3b6e; }
    label { display: block; margin: 1.1rem 0 0.4rem; font-weight: 600; color: #c4b5fd; }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%;
      max-width: 560px;
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #5a4a8a;
      background: #2a2a40;
      color: #e0e0ff;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      padding: 11px 24px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background: #7c3aed;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.8rem;
    }
    button:hover { background: #6d28d9; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.98rem;
      background: rgba(20,20,40,0.4);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td { padding: 12px 14px; text-align: left; }
    th {
      background: rgba(90, 74, 138, 0.55);
      cursor: pointer;
      user-select: none;
    }
    th:hover { background: rgba(100, 84, 148, 0.7); }
    tr:hover { background: rgba(60, 60, 90, 0.35); cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 1.4rem; align-items: center; }
    .empty { text-align: center; padding: 3rem; color: #888; font-style: italic; font-size: 1.1rem; }
    .error-msg { color: #ff6b6b; text-align: center; margin: 2rem 0; font-size: 1.2rem; }
    .loading { text-align: center; padding: 4rem; font-size: 1.3rem; opacity: 0.8; }
    .logout { text-align: center; margin: 3rem 0; font-size: 1.1rem; }
    .logout a {
      color: #ff8a8a;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      background: rgba(255,138,138,0.18);
      transition: 0.2s;
    }
    .logout a:hover { background: rgba(255,100,100,0.4); }

    .login-form {
      max-width: 400px;
      margin: 4rem auto;
      background: rgba(35, 35, 55, 0.65);
      padding: 2.2rem;
      border-radius: 16px;
      border: 1px solid #4a3b6e;
      text-align: center;
    }
    .login-form input {
      width: 100%;
      max-width: 320px;
      margin: 0.6rem auto;
      display: block;
    }
    .login-form button {
      width: 100%;
      max-width: 320px;
      margin-top: 1.6rem;
    }

    .hidden { display: none !important; }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.7);
    }
    .modal-content {
      background: rgba(35,35,55,0.95);
      margin: 10% auto;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid #4a3b6e;
      width: 90%;
      max-width: 600px;
      position: relative;
    }
    .close {
      position: absolute;
      right: 20px;
      top: 10px;
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover { color: white; }

    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { display: none; }
      tr { margin: 1.2rem 0; border: 1px solid #4a3b6e; border-radius: 10px; background: rgba(40,40,60,0.6); }
      td { border: none; padding: 14px 16px 14px 50%; position: relative; text-align: right; }
      td:before {
        content: attr(data-label);
        position: absolute;
        left: 16px;
        width: 45%;
        font-weight: 600;
        text-align: left;
        color: #c4b5fd;
      }
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1>Управление вечеринками</h1>

  <div id="loading" class="loading">Загрузка...</div>
  <div id="error" class="error-msg hidden"></div>

  <!-- Форма логина -->
  <div id="login-section" class="login-form hidden">
    <h2>Вход в админку</h2>
    <form id="admin-login-form">
      <input type="password" id="admin-password" placeholder="Пароль админа" required autocomplete="off">
      <button type="submit">Войти</button>
    </form>
  </div>

  <!-- Основной контент -->
  <div id="main-content" class="hidden">

    <div class="section">
      <h2>Новая вечеринка</h2>
      <form id="event-form">
        <label for="title">Название</label>
        <input type="text" id="title" name="title" placeholder="Silent Disco #8" required>

        <label for="start_time">Дата и время начала</label>
        <input type="datetime-local" id="start_time" name="start_time" required>

        <label for="main_place">Основное место</label>
        <input type="text" id="main_place" name="main_place" placeholder="Клуб Radar, Москва" required>

        <label for="zones">Зоны встречи (по одной в строке)</label>
        <textarea id="zones" name="zones" placeholder="Возле главного бара\nТанцпол правый\nЛаунж 2 этаж"></textarea>

        <label for="vibe">Вайб / жанры</label>
        <input type="text" id="vibe" name="vibe" placeholder="techno, deep house, cocktails">

        <label for="description">Описание</label>
        <textarea id="description" name="description" rows="3"></textarea>

        <button type="submit" id="submit-btn">Создать вечеринку</button>
      </form>
    </div>

    <div class="section">
      <h2>Существующие вечеринки</h2>
      <div class="controls">
        <select id="events-sort">
          <option value="date-desc">По дате ↓</option>
          <option value="date-asc">По дате ↑</option>
          <option value="title-asc">По названию A-Z</option>
          <option value="title-desc">По названию Z-A</option>
        </select>
        <input type="text" id="events-search" placeholder="Поиск по названию / месту / вайбу..."/>
        <button onclick="loadEvents()">Обновить</button>
      </div>
      <table id="events-table">
        <thead>
          <tr>
            <th data-sort="start_time">Дата / время</th>
            <th data-sort="title">Название</th>
            <th data-sort="main_place">Место</th>
            <th>Зоны</th>
            <th>Вайб</th>
            <th>Участников</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="event-modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeEventModal()">×</span>
        <h2>Редактировать вечеринку</h2>
        <form id="edit-event-form">
          <input type="hidden" id="edit-event-id" name="id">
          <label for="edit-title">Название</label>
          <input type="text" id="edit-title" name="title" required>
          <label for="edit-start_time">Дата и время начала</label>
          <input type="datetime-local" id="edit-start_time" name="start_time" required>
          <label for="edit-main_place">Основное место</label>
          <input type="text" id="edit-main_place" name="main_place" required>
          <label for="edit-zones">Зоны встречи (по одной в строке)</label>
          <textarea id="edit-zones" name="zones" rows="4"></textarea>
          <label for="edit-vibe">Вайб / жанры (через запятую)</label>
          <input type="text" id="edit-vibe" name="vibe">
          <label for="edit-description">Описание</label>
          <textarea id="edit-description" name="description" rows="3"></textarea>
          <button type="submit">Сохранить изменения</button>
        </form>
      </div>
    </div>

    <div class="logout">
      <a href="/admin-logout">Выйти из админки</a>
    </div>
  </div>
</div>

<script>
let eventsData = [];

async function checkAdmin() {
  console.log('checkAdmin started');
  const loading = document.getElementById('loading');
  const errorDiv = document.getElementById('error');
  const loginSection = document.getElementById('login-section');
  const mainContent = document.getElementById('main-content');

  loading.style.display = 'block';
  errorDiv.classList.add('hidden');

  try {
    console.log('Fetching /api/admin/users...');
    const res = await fetch('/api/admin/users', { credentials: 'include' });
    console.log('Admin check status:', res.status);

    if (res.ok) {
      console.log('Admin OK, loading events');
      loginSection.classList.add('hidden');
      mainContent.classList.remove('hidden');
      await loadEvents();
    } else {
      console.log('Not admin, show login');
      loginSection.classList.remove('hidden');
      mainContent.classList.add('hidden');
    }
  } catch (err) {
    console.error('checkAdmin error:', err);
    errorDiv.textContent = `Ошибка сети: ${err.message}`;
    errorDiv.classList.remove('hidden');
  } finally {
    console.log('checkAdmin finished');
    loading.style.display = 'none';
  }
}

async function loadEvents() {
  console.log('loadEvents started');
  const tbody = document.querySelector('#events-table tbody');
  const errorDiv = document.getElementById('error');
  tbody.innerHTML = '<tr><td colspan="6" class="loading">Загрузка мероприятий...</td></tr>';

  try {
    console.log('Fetching /api/admin/events...');
    const res = await fetch('/api/admin/events', { credentials: 'include' });
    console.log('Events fetch status:', res.status);

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    eventsData = await res.json();
    console.log('Events loaded:', eventsData.length, 'items');

    renderEvents(eventsData);
  } catch (err) {
    console.error('loadEvents error:', err);
    errorDiv.textContent = `Не удалось загрузить: ${err.message}`;
    errorDiv.classList.remove('hidden');
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Ошибка загрузки</td></tr>';
  }
}

function renderEvents(list) {
  console.log('renderEvents called with', list.length, 'items');
  const tbody = document.querySelector('#events-table tbody');
  tbody.innerHTML = '';

  if (!list?.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Пока нет вечеринок</td></tr>';
    return;
  }

  const sort = document.getElementById('events-sort').value;
  const search = document.getElementById('events-search').value.toLowerCase().trim();

  let filtered = list.filter(e =>
    !search ||
    (e.title || '').toLowerCase().includes(search) ||
    (e.main_place || '').toLowerCase().includes(search) ||
    (e.vibe || '').toLowerCase().includes(search)
  );

  if (sort === 'date-desc') filtered.sort((a,b) => (b.start_time || '').localeCompare(a.start_time || ''));
  if (sort === 'date-asc') filtered.sort((a,b) => (a.start_time || '').localeCompare(b.start_time || ''));
  if (sort === 'title-asc') filtered.sort((a,b) => (a.title || '').localeCompare(b.title || ''));
  if (sort === 'title-desc') filtered.sort((a,b) => (b.title || '').localeCompare(a.title || ''));

  filtered.forEach(e => {
    const zonesCount = e.zones ? e.zones.length : 0;
    const tr = document.createElement('tr');
    tr.dataset.id = e.id;
    tr.innerHTML = `
      <td data-label="Дата / время">${e.start_time || '—'}</td>
      <td data-label="Название">${e.title || '—'}</td>
      <td data-label="Место">${e.main_place || '—'}</td>
      <td data-label="Зоны">${zonesCount > 0 ? zonesCount : '—'}</td>
      <td data-label="Вайб">${e.vibe || '—'}</td>
      <td data-label="Участников">${e.participants ?? 0}</td>
    `;
    tr.addEventListener('click', () => openEventModal(e.id));
    tbody.appendChild(tr);
  });
}

function openEventModal(id) {
  console.log('Opening modal for event id:', id);
  fetch(`/api/admin/events/${id}`, { credentials: 'include' })
    .then(res => {
      console.log('Fetch event status:', res.status);
      if (!res.ok) throw new Error('Не удалось загрузить');
      return res.json();
    })
    .then(data => {
      document.getElementById('edit-event-id').value = data.id;
      document.getElementById('edit-title').value = data.title;
      document.getElementById('edit-start_time').value = data.start_time;
      document.getElementById('edit-main_place').value = data.main_place;
      document.getElementById('edit-zones').value = (data.zones || []).join('\n');
      document.getElementById('edit-vibe').value = data.vibe;
      document.getElementById('edit-description').value = data.description;

      document.getElementById('event-modal').style.display = 'block';
    })
    .catch(err => {
      console.error('Open modal error:', err);
      alert('Ошибка загрузки вечеринки: ' + err.message);
    });
}

function closeEventModal() {
  document.getElementById('event-modal').style.display = 'none';
  document.getElementById('edit-event-form').reset();
}

document.getElementById('edit-event-form').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('edit-event-id').value;
  const zonesText = document.getElementById('edit-zones').value.trim();
  const data = {
    title: document.getElementById('edit-title').value,
    start_time: document.getElementById('edit-start_time').value,
    main_place: document.getElementById('edit-main_place').value,
    zones: zonesText ? zonesText.split('\n').map(z => z.trim()).filter(Boolean) : [],
    vibe: document.getElementById('edit-vibe').value,
    description: document.getElementById('edit-description').value
  };

  try {
    const res = await fetch(`/api/admin/events/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      credentials: 'include'
    });
    if (res.ok) {
      alert('Вечеринка обновлена!');
      closeEventModal();
      loadEvents();
    } else {
      const err = await res.json();
      alert('Ошибка сохранения: ' + (err.error || 'неизвестно'));
    }
  } catch (err) {
    console.error('Save error:', err);
    alert('Сетевая ошибка: ' + err.message);
  }
});

document.getElementById('event-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  const formData = new FormData(e.target);
  const data = {
    title: formData.get('title'),
    start_time: formData.get('start_time'),
    main_place: formData.get('main_place'),
    zones: formData.get('zones')?.trim().split('\n').map(z => z.trim()).filter(Boolean) || [],
    vibe: formData.get('vibe'),
    description: formData.get('description')
  };

  try {
    const res = await fetch('/api/admin/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      credentials: 'include'
    });
    if (res.ok) {
      alert('Вечеринка создана!');
      e.target.reset();
      loadEvents();
    } else {
      const err = await res.json();
      alert('Ошибка: ' + (err.error || 'неизвестно'));
    }
  } catch (err) {
    alert('Сетевая ошибка: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('events-sort').addEventListener('change', () => renderEvents(eventsData));
document.getElementById('events-search').addEventListener('input', () => renderEvents(eventsData));

document.getElementById('admin-login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const password = document.getElementById('admin-password').value;

  try {
    const res = await fetch('/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `password=${encodeURIComponent(password)}`,
      credentials: 'include'
    });
    if (res.ok || res.redirected) {
      checkAdmin();
    } else {
      alert('Неверный пароль');
    }
  } catch {
    alert('Ошибка входа');
  }
});

window.addEventListener('click', e => {
  const modal = document.getElementById('event-modal');
  if (e.target === modal) closeEventModal();
});

document.addEventListener('DOMContentLoaded', () => {
  console.log('Page loaded, starting checkAdmin');
  checkAdmin();
});
</script>
</body>
</html>
